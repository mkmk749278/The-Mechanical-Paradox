# A film's Blender hero shots (Cycles) on GitHub's runners (PLAYBOOK §10.6). Each shot's meshes, camera and poses are
# exported from the film's own picture code (scripts/export_blender_shot.mjs), so a plate lines up with the HUD and every
# callout; blender/render_shot.py renders frames with a transparent film; each block goes to Drive
# <film>/render-media/plates_tar/<shot>_<start>.tar (WebP with alpha), which the Remotion farm pulls and unpacks.
# The runners have no GPU: Cycles on 4 CPU cores, about 75 s a 1080p frame at 16 samples (film 1, 2026-11-04).
# Needs the repo secret GDRIVE_RCLONE_TOKEN.
name: blender-render
on:
  workflow_dispatch:
    inputs:
      film:
        description: "films/<film>"
        required: true
      module:
        description: "the film's module exporting exportShot(id)"
        default: "remotion/blenderExport.ts"
      script:
        description: "the Blender script (repo path): blender/render_shot.py (film 1) or a film's own, e.g. films/seatbelt-lock/blender/render.py"
        default: "blender/render_shot.py"
      shots:
        description: "comma-separated shot ids"
        required: true
      width:
        description: "frame width (1920 for review cuts; 3840 for the 4K master)"
        default: "1920"
      samples:
        description: "Cycles samples (denoised)"
        default: "16"
      runners:
        description: "parallel runners: auto = every runner free across the 3 channels' repos, at least 7 (PLAYBOOK §3a.4); or 1-20"
        default: "auto"
      blocks:
        description: "optional: exact blocks to render, shot:start:end,… (re-render missing frames; overrides runners)"
        default: ""

permissions:
  contents: read
  actions: read

env:
  BLENDER_VER: "4.5.14"
  BLENDER_SHA256: "9ba871ff2ecd36526b77432745980b7e6664ecd0c7ca11c48849073dcfe06da3"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      blocks: ${{ steps.p.outputs.blocks }}
      runners: ${{ steps.rs.outputs.n }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Runner share (the account's 20 jobs are shared by three channels; PLAYBOOK §3a.4)
        id: rs
        env:
          RUNNER_SHARE_TOKEN: ${{ secrets.RUNNER_SHARE_TOKEN }}
          WANT: ${{ inputs.runners }}
        run: echo "n=$(python3 scripts/runner_share.py --want "$WANT")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22.11.0"
      - name: Secret present
        env:
          T: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
        run: '[ -n "$T" ] || { echo "::error::repo secret GDRIVE_RCLONE_TOKEN is missing"; exit 1; }'
      - run: npm ci --no-audit --no-fund
      # Blender is fetched once here and handed to the render jobs as an artifact: 21 runners fetching it at once from
      # download.blender.org got error pages on 2 of them (run 41858536600)
      - name: Blender (pinned, checksum verified)
        run: |
          # download.blender.org answered 403 to a runner (run 43544817419): the official mirrors follow; the sha256 makes
          # every source equally safe
          F="Blender${BLENDER_VER%.*}/blender-${BLENDER_VER}-linux-x64.tar.xz"
          ok=""
          for i in 1 2; do
            for base in https://download.blender.org/release https://mirror.clarkson.edu/blender/release \
                        https://ftp.nluug.nl/pub/graphics/blender/release https://mirrors.dotsrc.org/blender/blender-release; do
              curl -sSfL -m 900 -o blender.tar.xz "$base/$F" && echo "${BLENDER_SHA256}  blender.tar.xz" | sha256sum -c - \
                && { ok=1; echo "Blender from $base"; break 2; }
            done
            sleep 20
          done
          [ -n "$ok" ] || exit 1
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: blender
          path: blender.tar.xz
          compression-level: 0
          retention-days: 1
      - id: p
        env:
          FILM: ${{ inputs.film }}
          MODULE: ${{ inputs.module }}
          SHOTS: ${{ inputs.shots }}
          RUNNERS: ${{ steps.rs.outputs.n }}
          BLOCKS: ${{ inputs.blocks }}
          WIDTH: ${{ inputs.width }}
          SAMPLES: ${{ inputs.samples }}
        run: |
          if [ -n "$BLOCKS" ]; then
            python3 -c "import json,os;print('blocks='+json.dumps(os.environ['BLOCKS'].split(',')))" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for s in ${SHOTS//,/ }; do node scripts/export_blender_shot.mjs "films/$FILM/$MODULE" "$s" "export/$s.json"; done
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          shots = os.environ["SHOTS"].split(",")
          frames = [(s, n) for s in shots for n in range(len(json.load(open(f"export/{s}.json"))["frames"]))]
          k = max(1, min(20, int(os.environ["RUNNERS"])))
          # a block must finish inside the 350-minute job timeout: film 1 measured ~75 s a frame at 1920 px and ~6 min
          # at 3840 px, at 16 samples. More blocks than runners is fine: max-parallel runs them as runners free up.
          base = 36 if int(os.environ["WIDTH"]) > 1920 else 240
          cap = max(1, base * 16 // max(1, int(os.environ["SAMPLES"])))
          size = min(-(-len(frames) // k), cap)
          blocks = []
          for i in range(0, len(frames), size):
              chunk = frames[i:i + size]
              for s in dict.fromkeys(x[0] for x in chunk):  # a block may span two shots
                  ns = [n for (t, n) in chunk if t == s]
                  blocks.append(f"{s}:{ns[0]}:{ns[-1] + 1}")
          if len(blocks) > 256:  # GitHub's matrix limit
              raise SystemExit(f"{len(blocks)} blocks > 256: split the shots over two runs or lower the samples")
          print("blocks=" + json.dumps(blocks))
          EOF

  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.plan.outputs.runners) }}
      matrix:
        block: ${{ fromJson(needs.plan.outputs.blocks) }}
    env:
      GDRIVE_RCLONE_TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
      FILM: ${{ inputs.film }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22.11.0"
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          scripts/apt_retry.sh ffmpeg libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1
      - uses: actions/download-artifact@v4.1.8
        with:
          name: blender
      - name: Blender
        run: |
          echo "${BLENDER_SHA256}  blender.tar.xz" | sha256sum -c -
          tar -xf blender.tar.xz && rm blender.tar.xz
          echo "BLENDER=$PWD/blender-${BLENDER_VER}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Film assets (pinned CC0 files, if the film has any)
        run: '[ ! -x "films/$FILM/blender/fetch_assets.sh" ] || "films/$FILM/blender/fetch_assets.sh"'
      - name: Render
        shell: bash
        run: |
          IFS=: read -r SHOT START END <<< "${{ matrix.block }}"
          echo "SHOT=$SHOT" >> "$GITHUB_ENV"
          node scripts/export_blender_shot.mjs "films/$FILM/${{ inputs.module }}" "$SHOT" "export/$SHOT.json"
          "$BLENDER" -b --factory-startup -P "${{ inputs.script }}" -- "export/$SHOT.json" "out/$SHOT" \
            --start "$START" --end "$END" --width ${{ inputs.width }} --samples ${{ inputs.samples }} 2>&1 \
            | grep --line-buffered -E "PLATE|Error|Traceback|line [0-9]+"
          n=$(ls out/$SHOT/*.png | wc -l); want=$((END - START))
          [ "$n" -eq "$want" ] || { echo "::error::$n of $want frames"; exit 1; }
      # one tar per block (plates/<shot>/NNNNN.webp inside): the Remotion farm pulls a few dozen tars, not thousands of
      # frames (700 single frames took 10 min to pull, film 1)
      - name: WebP with alpha → one tar per block → Drive
        shell: bash
        run: |
          IFS=: read -r _ START _ <<< "${{ matrix.block }}"
          mkdir -p "pack/plates/$SHOT" tars
          for f in out/$SHOT/*.png; do
            ffmpeg -v error -y -i "$f" -c:v libwebp -quality 92 -pix_fmt yuva420p "pack/plates/$SHOT/$(basename "$f" .png).webp"
          done
          tar -cf "tars/${SHOT}_$(printf %05d "$START").tar" -C pack plates
          scripts/upload_gdrive.sh --sub "$FILM/render-media/plates_tar" tars
