# The Mechanical Paradox brand tokens (owner's blueprint §1.2 and §2.2, PLAYBOOK §6).
# Scenes read these through lib/remotion/brand.ts (generated by scripts/brand_ts.py); never type a colour by hand.
channel_name: "The Mechanical Paradox"
handle: "@themechanicalparadox"
tagline: "The engineering that shouldn't work. The invisible physics that makes it."
bio_line: "Real mechanics. Invisible physics. Zero fluff."
colors:
  # canvas
  bg: "#070A0F"          # Abyss Black: the canvas; never pure #000000
  bg_lift: "#0D1420"     # the abyss lifted: centre of a vignette, panels
  grid: "#141E2C"        # Blueprint Slate: coordinate grids, reference axes
  # line and material
  line: "#F0F4F8"        # Blueprint White: logo and schematic linework
  specular: "#F1F5F9"    # High-Grade Specular: polished edges, gear faces, cutting tools
  metal: "#6A7B8C"       # Cast Iron Gray: housings, shafts, frames
  muted: "#5A6E85"       # labels, monospace kickers, construction lines
  sub: "#8B9EB5"         # secondary text
  ink: "#FFFFFF"         # headline text
  # meaning (colour = meaning, every frame)
  crimson: "#FF3B30"     # Stress Crimson: tension, heat, warning, failure
  cyan: "#00E5FF"        # Dynamic Cyan: compression, fluid flow
  emerald: "#00F59B"     # Kinetic Emerald: balance, correct clearance, energy recovered
  amber: "#FF9F1C"       # Shear Amber: friction, boundary layers, fields; the paradox focal point
fea_ramp: ["#0B1F4D", "#00E5FF", "#FFE14D", "#FF3B30", "#B0001E"]   # von Mises bloom: navy → cyan → yellow → red
fonts:                   # vendored OFL fonts (fontsource), PLAYBOOK §6.3
  display: "Archivo"           # heavy display sans: headlines, chapter titles (Black 900, expanded width)
  text: "Inter"                # labels, callouts, subtitles
  mono: "JetBrains Mono"       # HUD telemetry, kickers, equations' variables
logo:
  master: assets/brand/logo.svg        # the Locked Trio, with blueprint construction lines
  mark: assets/brand/logo_mark.svg     # no construction lines: stings, bug, watermark
  favicon: assets/brand/favicon.svg    # 9-tooth bold version for 16-48 px
  banner: assets/brand/banner_2560x1440.png
video:
  width: 1920            # authoring canvas
  height: 1080
  fps: 60
  render_scale: 2        # 4K master via scale 2; review cuts at 2/3 (720p)
spring:                  # the blueprint's default physical spring (§2.3 rule 2)
  mass: 1.2
  damping: 24
  stiffness: 180
